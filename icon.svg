<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e3a8a" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" filter="url(#shadow)" />
  <!-- Gloss reflection overlay -->
  <path d="M0,128 C0,57.3 57.3,0 128,0 L384,0 C454.7,0 512,57.3 512,128 C350,180 180,180 0,128 Z" fill="white" opacity="0.12" />
  
  <!-- Pill emblem rotated 45 deg in center -->
  <g transform="translate(256, 256) rotate(-45)">
    <!-- Pill Capsule Container -->
    <rect x="-70" y="-140" width="140" height="280" rx="70" fill="url(#pillGrad)" filter="url(#shadow)" />
    <!-- Top Half Color -->
    <path d="M-70,0 L70,0 L70,-70 C70,-108.7 -38.7,-140 -70,-70 Z" fill="#38bdf8" />
    <!-- Divider Line -->
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#0284c7" stroke-width="6" opacity="0.4" />
    <!-- Sparkle accent -->
    <circle cx="25" cy="-70" r="12" fill="white" opacity="0.8" />
  </g>
</svg>
